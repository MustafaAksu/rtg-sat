name: Publish adopted COIL releases
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/coil-publish-adopted.yml
permissions:
  contents: write
concurrency:
  group: coil-adopted-tags-20261109
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Clone public repository at the publication merge
        shell: bash
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/MustafaAksu/rtg-sat.git repo
          git -C repo checkout --detach "$GITHUB_SHA"
      - name: Verify adopted records and payloads, then atomically create annotated tags
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -I -B -u repo/evidence/coil/verification/publish_coil_adopted_tags.py repo
