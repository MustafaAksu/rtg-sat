name: COIL source intake review

on:
  push:
    branches: [chatgpt/coil-intake-pr3]
    paths:
      - evidence/coil/verification/verify_coil_upload.py
      - .github/workflows/coil-source-intake-review.yml

permissions:
  contents: read

jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SOURCE_COMMIT: 01a262e3b1039ae394a3aca5891076cc511f22d5
      CHECK_COMMIT: b1330c51bb1e33eb92a105446aab9559a730a6c9
    steps:
      - name: Fetch pinned public source and reviewer script without credentials
        shell: bash
        run: |
          set -euo pipefail
          git init source
          git -C source config core.autocrlf false
          git -C source remote add origin https://github.com/MustafaAksu/rtg-sat.git
          git -C source fetch --depth=1 origin "$SOURCE_COMMIT"
          git -C source checkout --detach FETCH_HEAD
          git -C source fetch --depth=1 origin "$CHECK_COMMIT"
          git -C source show "$CHECK_COMMIT:evidence/coil/verification/verify_coil_upload.py" > "$RUNNER_TEMP/verify_coil_upload.py"
          sha256sum "$RUNNER_TEMP/verify_coil_upload.py"
      - name: Verify all manifest bytes and inspect ZIP members without extraction
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/verify_coil_upload.py" \
            --root source/upload/coil \
            --source-commit "$SOURCE_COMMIT" \
            --expected-count 212 \
            --report "$RUNNER_TEMP/coil_intake_report.json"
          test -z "$(git -C source status --porcelain --untracked-files=all)"
      - name: Preserve complete machine report in the job log
        if: always()
        shell: bash
        run: |
          if test -f "$RUNNER_TEMP/coil_intake_report.json"; then
            echo '::group::Complete source-intake report (not scientific or rights adoption)'
            cat "$RUNNER_TEMP/coil_intake_report.json"
            echo '::endgroup::'
          fi
