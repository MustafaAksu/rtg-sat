name: COIL migration independent review
on:
  push:
    branches: [chatgpt/coil-migration-review-20261109]
    paths:
      - evidence/coil/verification/check_coil_migration.py
      - .github/workflows/coil-migration-independent-review.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Clone public repository without credentials at the exact workflow commit
        shell: bash
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/MustafaAksu/rtg-sat.git repo
          git -C repo checkout --detach "$GITHUB_SHA"
          git -C repo rev-parse HEAD
      - name: Check pinned source bytes, archive members, translation identities and local merge order
        shell: bash
        run: |
          set -euo pipefail
          python -I -B repo/evidence/coil/verification/check_coil_migration.py repo
